name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Restore-only on tag releases. The cache *save* phase tar-gz's the
      # cargo target/ on the Windows runner, where the MSVC linker / NSIS
      # bundler / signtool processes still hold file handles after the
      # tauri-action build returns; tar.exe hits a sharing violation and
      # fails the post-step (artifacts already uploaded fine — but the
      # whole run goes red). Tag releases are infrequent and runners are
      # ephemeral, so skipping the save loses ~3 min on the next tag while
      # eliminating the guaranteed periodic failure. CI (ci.yml) still
      # saves on every main push, so this Release workflow can still
      # restore from a CI-populated cache when keys match.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: npm ci

      - name: Build + upload via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BW_UPDATER_PUBKEY: ${{ secrets.BW_UPDATER_PUBKEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BW Build Overlay ${{ github.ref_name }}"
          # When generateReleaseNotes is true, GitHub's Release Notes API
          # appends a "What's Changed" section (PRs merged since the prior
          # tag, with PR numbers and authors) and a "Full Changelog" diff
          # link. releaseBody below is pre-pended to that auto-generated
          # body, so the static CHANGELOG.md pointer still appears at the
          # top followed by the per-PR list underneath.
          releaseBody: "See CHANGELOG.md for full release notes."
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
